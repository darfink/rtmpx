name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rtmpx-docs-${{ hashFiles('Cargo.lock') }}
          restore-keys: rtmpx-docs-

      - name: Build crate docs
        run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

      - name: Add root redirect to crate docs
        # cargo doc emits the crate at <root>/rtmpx/ with no root index,
        # so Pages would serve a blank page at the site root without this.
        run: printf '%s\n' '<!doctype html>' '<html><head><meta charset="utf-8"><meta http-equiv="refresh" content="0; url=./rtmpx/">' '<title>Redirecting to rtmpx docs</title></head>' '<body><p>Redirecting to <a href="./rtmpx/">crate docs</a>.</p></body></html>' > target/doc/index.html

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/doc

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
